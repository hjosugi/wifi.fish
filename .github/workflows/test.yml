name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y fish
      - run: fish --version
      - name: syntax
        run: for f in functions/*.fish completions/*.fish tests/*.fish; do fish --no-execute "$f"; done
      - name: format
        run: fish_indent --check functions/*.fish completions/*.fish tests/*.fish
      - name: tests
        run: fish --no-config tests/wifi.fish
